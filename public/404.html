<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // 简单的回退重定向，让 HashRouter 接管
    location.replace('./#' + (location.pathname + location.search + location.hash).replace(/^\//, ''));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
