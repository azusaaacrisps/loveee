<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // 保存当前完整路径，然后重定向到根路径让 React Router 接管
    sessionStorage.setItem(
      'redirect',
      location.pathname + location.search + location.hash
    );
    location.replace('./');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
